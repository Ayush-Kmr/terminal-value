# ============================================================
#  The Bhojpuri comedy channel. Laid over config.yaml when CHANNEL=bh, so only
#  what differs is here. It makes its own videos: short comedy skits with three
#  recurring cartoon characters, written, voiced and drawn by AI (src/skit.py).
#  Nothing from the English channel's news pipeline is used.
# ============================================================

channel:
  name: "Bhojpuri AI Comedy"
  handle: "@BhojpuriAIComedyShorts"      # set in Studio 2026-11-08 (@BhojpuriAIComedy was taken)
  channel_id: "UC5QnQWBbS5AVKvgxsZl4V3w"   # uploads refuse to go anywhere else
  url: "https://www.youtube.com/@BhojpuriAIComedyShorts"
  tagline: "ललन चाचा के घर, रोज नया बवाल!"
  # Bhojpuri. Number reading and the voice treat it as Hindi (same script).
  language: bho
  # YouTube has no Bhojpuri in its language list ("bho" fails branding
  # validation), so every YouTube language field says Hindi.
  youtube_language: hi
  country: IN
  timezone: Asia/Kolkata
  about: |
    ललन चाचा, फूलमती चाची, भतीजा बबलू आ रूसल फूफा जी: एगो गाँव, एगो घर, आ रोज नया बवाल! 😂

    Four Bhojpuri comedy Shorts every day Monday to Saturday, and every Sunday the week's funniest skits in one long video: Lallan Chacha, Phoolmati Chachi, their nephew Bablu and the easily offended Fufa Ji, in short funny skits from village life. Smartphones, power cuts, weddings, exams, WhatsApp forwards and more.

    सोमवार से शनिचर रोज चार गो नया कॉमेडी Shorts, आ हर एतवार के साँझ हफ्ता भर के सबसे मजेदार कॉमेडी एगो लंबा वीडियो में।

    Every video is made with AI: the story, the voices and the pictures. The characters are made up; any likeness to real people is a coincidence. Clean family comedy, no vulgarity.
  keywords:
    - bhojpuri comedy
    - bhojpuri comedy video
    - bhojpuri funny video
    - bhojpuri ai comedy
    - ai comedy video
    - funny cartoon comedy
    - bihari comedy
    - desi comedy
    - village comedy
    - bhojpuri shorts
    - भोजपुरी कॉमेडी
    - भोजपुरी कॉमेडी वीडियो
    - चाचा भतीजा कॉमेडी
  links:
    - "Subscribe: https://www.youtube.com/channel/UC5QnQWBbS5AVKvgxsZl4V3w?sub_confirmation=1"
  cta: >-
    रोज नया बवाल देखे खातिर चैनल के सब्सक्राइब करीं! 🔔
  disclosure: >-
    This video is made with AI: the script, the voices and the pictures. The
    characters are made up. / ई वीडियो AI से बनल बा।

# The whole skit format. src/skit.py reads everything under here.
skit:
  per_day: 2                     # Mon-Sat; Sunday = the long video only. Was 4 (2026-11-10);
                                 # 2 from 2026-11-13: notification cap of 3 a day, more effort per skit
  # Sunday's long video: the week's skits back to back in 16:9, most watched
  # first, a chapter each (skit.weekly in src/skit.py).
  weekly:
    days_back: 7
    min_clips: 6
    max_clips: 24                # 24 x ~25 s = about 10 minutes
  # Analysis 2026-11-13: skits of 20-25 s (5-7 lines) held 2-5x the views of
  # the 29-34 s ones, and every Shorts watch-through sat at 18-34%. Shorter.
  lines: [5, 7]                  # dialogue lines per skit
  # Lallan Chacha leads every skit he is cast in (all three outliers starred
  # him), and is added to any cast that lacks him. "" = whoever speaks first.
  lead: lallan
  # Numbered series switched off 2026-11-13: every "भाग 1/2" skit got 0-20
  # views; the parts were standalone, so "Part 2" only told viewers they had
  # missed something. {lead key: series name} turns it back on.
  series: {}
  # Spoken after the punchline by the lead (audit 2026-11-10: 2 subscribers
  # from 2,387 views). {part} = next part, only meaningful with a series.
  follow_lines:
    - "रोज नया बवाल देखे खातिर अबहीं फॉलो करीं!"
    - "काल्हु अउरी बवाल होई, फॉलो कर लीं!"
    - "चाचा के अगिला कांड खातिर फॉलो करीं!"
  max_words: 60                  # ~20-25 s once voiced
  max_line_words: 14
  ideas: data/bhojpuri_ideas.yaml
  search_phrases: ["Bhojpuri Comedy", "Bhojpuri Funny Video", "Bhojpuri AI Comedy", "Bhojpuri Comedy Video"]
  # One skit a day on what India is watching: YouTube's India trending chart,
  # videos with 1M+ views; the subject only, never the video or real people.
  trending:
    per_day: 1                   # one of the two skits on what India is watching today
    min_views: 1000000
    categories: ["", "24", "23", "17", "10"]   # all, entertainment, comedy, sports, music
  # Pictures: Cloudflare Workers AI (FLUX schnell), one per line. Every prompt
  # carries the character's full look, so they stay recognisable from shot to shot.
  style: >-
    colourful 3D animated cartoon scene, full-frame, cute exaggerated characters with
    big heads and big expressive eyes, soft warm lighting, vibrant saturated
    colours, high detail, centred composition, characters in the middle of the
    frame, no letterbox bars, no borders, no text, no letters, no subtitles, no watermark
  characters:
    lallan:
      name: Lallan Chacha
      colour: "#E8590C"
      name_bho: ललन चाचा
      role: >-
        the head of the house, a proud 62-year-old village uncle who thinks he
        knows everything, especially about phones and the internet, and is
        always wrong; stubborn, dramatic, lovable
      look: >-
        Lallan Chacha, a chubby 62-year-old Indian village uncle with a round
        belly, thick grey handlebar moustache, bald head with white hair on the
        sides, round black glasses, fully dressed in a long-sleeved white kurta
        shirt and white dhoti, with a red-and-white checked gamchha towel on his
        shoulder
      voice: >-
        Rohit speaks in a deep, slightly hoarse and very expressive voice at a
        lively pace, with a dramatic tone. The recording is very clear and close up.
    phoolmati:
      name: Phoolmati Chachi
      colour: "#D6336C"
      name_bho: फूलमती चाची
      role: >-
        Lallan's sharp-tongued, quick-witted wife who runs the house and always
        wins the argument; she loves TV serials and gossip
      look: >-
        Phoolmati Chachi, a plump 55-year-old Indian village aunty in a bright
        red-and-yellow cotton saree with the end over her head, a big round red
        bindi, red sindoor in her hair parting and green glass bangles
      voice: >-
        Divya speaks in a loud, sharp and very expressive voice at a fast pace,
        with a playful scolding tone. The recording is very clear and close up.
    bablu:
      name: Bablu
      colour: "#1C7ED6"
      name_bho: बबलू
      role: >-
        their 19-year-old nephew, glued to his smartphone, wants to be an
        influencer, lazy but smart, always has a shortcut
      look: >-
        Bablu, a skinny 19-year-old Indian village boy with spiky gelled black
        hair, a thin moustache, a bright yellow t-shirt, blue ripped jeans, white
        earphones round his neck and a smartphone in his hand
      voice: >-
        Aman speaks in a cheerful, energetic and expressive voice at a fast pace.
        The recording is very clear and close up.
    # Added 2026-11-10 (audience research: "Fufa Ji 3" was the top Bhojpuri
    # comedy of the month, 18M views; the easily offended fufa is a classic).
    fufa:
      name: Fufa Ji
      colour: "#2F9E44"
      name_bho: फूफा जी
      role: >-
        Lallan's brother-in-law who visits and stays too long; pompous, gets
        offended (रूस जाला) over the smallest thing, expects VIP treatment and
        is always secretly the cause of the trouble
      look: >-
        Fufa Ji, a tall thin 58-year-old Indian man with a big black curled
        moustache, slicked-back dyed black hair, a shiny cream silk kurta with a
        maroon Nehru jacket, a gold watch, and a folded umbrella in his hand
      voice: >-
        Rohit speaks in a slow, nasal, pompous voice with long dramatic pauses
        and an offended tone. The recording is very clear and close up.

voice:
  # AI4Bharat Indic Parler-TTS (Apache-2.0), run on the build machine. Each
  # character's own description (skit.characters.*.voice) picks the speaker.
  provider: indic
  # Whisper hears Bhojpuri as Hindi and spells it the Hindi way, so a clean
  # take scores lower than in English. The bar still catches a dropped line.
  match_ok: 0.45
  check_rounds: 1
  tempo: 1.1
  indic:
    description: >-
      Rohit speaks in a clear, expressive voice at a lively pace. The recording
      is very clear and close up.

localize:
  languages: {}

format:
  long:
    publish_times: ["18:00"]           # Sunday evening, India time
  short:
    # India time: lunch, tea time, evening, night. A slot already gone when the
    # (often late) run gets there goes public at once, never the next day.
    publish_times: ["12:30", "19:30"]
    shot_seconds: [1.5, 7]             # one picture per line, however short

visuals:
  style: classic
  short_style: classic           # bright cartoon pictures: no news grade
  hard_cuts: true                # comedy cuts on the line, no dissolves
  palette:
    bg: "#1B1030"
    surface: "#2A1A48"
    ink: "#FFFFFF"
    muted: "#FFE7A3"
    accent: "#FFD23F"
    danger: "#FF4D6D"
  fonts:                         # Devanagari on every card and caption (OFL)
    display: "assets/fonts/Baloo2-Variable.ttf"
    body:    "assets/fonts/Baloo2-Variable.ttf"
    mono:    "assets/fonts/Baloo2-Variable.ttf"
    caption: "assets/fonts/Baloo2-Variable.ttf"
  font_weights: {display: ExtraBold, body: Bold, mono: Bold, caption: ExtraBold}
  labels:
    wordmark: भोजपुरी AI कॉमेडी

audio:
  music_dir: assets/music/comedy
  music_volume: 0.14
  credits:
    Fluffing-a-Duck: "Fluffing a Duck"
    Monkeys-Spinning-Monkeys: "Monkeys Spinning Monkeys"
    Sneaky-Snitch: "Sneaky Snitch"

upload:
  category_id: 23                # Comedy
  playlists:
    hi: "भोजपुरी कॉमेडी Shorts"
  hashtag_default: "#bhojpuricomedy"
  hashtags: {}
  title_series: {}
  # A playlist per character: a skit joins the playlist of everyone in it.
  topic_playlists:
    "Fufa Ji Comedy": [fufa]
    "Lallan Chacha Comedy": [lallan]
    "Phoolmati Chachi Comedy": [phoolmati]
    "Bablu Comedy": [bablu]

# The link under each skit's question comment (src/engage.py).
labels:
  deep_dive: "पूरा हफ्ता के कॉमेडी एके वीडियो में"
