# ============================================================
#  The Tamil channel. Laid over config.yaml when CHANNEL=ta, so only what differs
#  is here. It publishes every main-channel video again, entirely in Tamil
#  (src/follow.py): narration, cards, titles, descriptions, tags and hashtags.
# ============================================================

channel:
  name: "Terminal Value Tamil"
  handle: "@TerminalValueTamil"
  channel_id: "UC5QnQWBbS5AVKvgxsZl4V3w"   # uploads refuse to go anywhere else
  url: "https://www.youtube.com/@TerminalValueTamil"
  tagline: "செய்திக்குப் பின்னால் இருக்கும் கதை."
  language: ta
  country: IN
  timezone: Asia/Kolkata
  about: |
    தமிழ்நாடு மற்றும் இந்தியாவின் பணம், விலைவாசி, வேலை, வணிகச் செய்திகள், தமிழில் தெளிவாக. தங்கம் விலை, பெட்ரோல் விலை, அரசுத் திட்டங்கள், சம்பளம், வேலைவாய்ப்பு: என்ன நடந்தது, உங்கள் குடும்பத்திற்கு இது என்ன அர்த்தம் என்பதை எளிமையாக விளக்குகிறோம்.

    தமிழ்நாட்டில் இன்று அதிகம் தேடப்படும் செய்திகளை, நம்பகமான செய்தித்தாள்களைப் படித்து, எண்கள், தேதிகள், சம்பந்தப்பட்டவர்களுடன் விளக்குகிறோம்.

    தினமும் ஒரு புதிய குறுவீடியோ.

    ஒவ்வொரு வீடியோவின் விளக்கத்திலும் ஆதாரங்கள் உள்ளன. ஸ்கிரிப்ட்டும் குரலும் வெளியான செய்திகளிலிருந்து செயற்கை நுண்ணறிவு மூலம் உருவாக்கப்படுகின்றன. இது நிதி ஆலோசனை அல்ல. தவறு இருந்தால் கருத்துகளில் சொல்லுங்கள், திருத்துவோம்.
  # English first: what Tamil viewers type into search.
  keywords:
    - gold rate today tamil
    - tamil nadu news today
    - business news tamil
    - petrol price today tamil
    - tn govt scheme tamil
    - share market news today in tamil
    - epfo news tamil
    - rbi news tamil
    - தங்கம் விலை இன்று
    - தங்கம் விலை நிலவரம்
    - பெட்ரோல் விலை இன்று
    - தமிழ்நாடு அரசு திட்டம்
    - வணிகச் செய்திகள்
    - பங்குச் சந்தை செய்திகள்
    - பொருளாதாரம் தமிழில்
    - விலைவாசி உயர்வு
  links:
    - "சந்தா செலுத்த: https://www.youtube.com/@TerminalValueTamil?sub_confirmation=1"
  cta: >-
    தினமும் ஒரு புதிய குறுவீடியோ.
    செய்திக்குப் பின்னால் இருக்கும் கதையைத் தவறவிடாமல் இருக்க சந்தா செலுத்துங்கள்.
  disclosure: >-
    இந்த வீடியோ செயற்கை நுண்ணறிவு மூலம் தயாரிக்கப்பட்டது: மேலே உள்ள செய்தி அறிக்கைகளிலிருந்து
    ஸ்கிரிப்ட் எழுதப்பட்டு, குரல் உருவாக்கப்பட்டது. திருத்தங்களை கருத்துகளில் வரவேற்கிறோம்.

voice:
  # AI4Bharat Indic Parler-TTS (Apache-2.0), run on the build machine. The English
  # voice cannot speak Tamil. Jaya is the model's recommended Tamil speaker.
  provider: indic
  match_ok: 0.75               # sound-skeleton match (src/voice.py): clean takes 0.85+, clipped ~0.6
  check_rounds: 1              # a full second and third take added two hours to a long video
  indic:
    description: >-
      Jaya speaks in a clear, confident and slightly expressive tone at a
      moderate pace, with a moderate pitch. The recording is of very high
      quality, with the speaker's voice sounding clear and very close up.

localize:
  languages: {}

labels:
  full_story: முழு கதை
  chapters: {hook: கதை, what_happened: என்ன நடந்தது, background: எப்படி இங்கு வந்தோம், stakes: ஏன் முக்கியம், whats_next: அடுத்து என்ன, rise: எழுச்சி, crack: விரிசல், fall: வீழ்ச்சி, legacy: என்ன மாறியது, beginnings: தொடக்கம், bet: பெரிய முடிவு, empire: சாம்ராஜ்யம்}
  description: {chapters: அத்தியாயங்கள், sources: ஆதாரங்கள்}

upload:
  series_playlist: "அது எப்படி வீழ்ந்தது"
  playlists:
    ta: "தமிழ் விளக்கங்கள்"
  hashtag_default: "#வணிகம்"
  hashtags:
    "பங்குச் சந்தை & நிறுவனங்கள்": "#பங்குச்சந்தை"
    "செயற்கை நுண்ணறிவு & தொழில்நுட்பம்": "#தொழில்நுட்பம்"
    "வங்கி & வட்டி விகிதங்கள்": "#வட்டிவிகிதம்"
    "வர்த்தகம் & வரிகள்": "#வர்த்தகம்"
    "பொருளாதாரம் & வேலைகள்": "#பொருளாதாரம்"
  topic_playlists:
    "பங்குச் சந்தை & நிறுவனங்கள்": [stock, stocks, share, shares, nasdaq, dow, ipo, market, markets, investors, earnings, profit, layoffs, ceo, startup, valuation, bear, bull]
    "செயற்கை நுண்ணறிவு & தொழில்நுட்பம்": [ai, nvidia, openai, anthropic, microsoft, google, apple, amazon, meta, tesla, chip, chips, semiconductor, spacex]
    "வங்கி & வட்டி விகிதங்கள்": [fed, federal, powell, bank, banks, banking, rate, rates, mortgage, inflation, loan, loans, credit, treasury, gold]
    "வர்த்தகம் & வரிகள்": [trade, tariff, tariffs, export, exports, import, imports, sanctions, oil, wto]
    "பொருளாதாரம் & வேலைகள்": [economy, economic, recession, jobs, unemployment, wages, gdp, consumer, dollar, debt, deficit]

# The Tamil channel follows its OWN builds: channels/ta-src.yaml picks today's
# Tamil Nadu stories and builds them; nothing from the English channel.
follow:
  adapt_to: Tamil Nadu         # viewer-impact lines rewritten for this audience
  # Audit 2026-11-04: single-stock Shorts (MARKETS) got 0 views here, and the
  # two Tamil long videos got 3 views in total for ~4.5 runner hours each.
  # One Short a day until Tamil Shorts average 20+ views, then turn long back on.
  skip_regions: [MARKETS]
  max_shorts: 1
  # The Short Tamil takes is the one closest to household money. Tamil data to
  # 2026-11-04: egg prices 1,407 views, IDBI sale 446, EPFO pension 327; single
  # stocks and US tech (Inovio, LiveWire, Kalshi, AI bubble) 0-3.
  prefer_words: [price, prices, expensive, cost, costs, inflation, egg, eggs, food,
                 grocery, groceries, rent, gas, petrol, fuel, gold, silver, salary,
                 wages, pension, savings, loan, loans, mortgage, interest, rates, rate,
                 tax, taxes, tariff, tariffs, jobs, layoffs, bank, banks, insurance, coffee,
                 beef, childcare, health, india, indian, rupee, dollar]
  long: false

format:
  long:
    publish_times: ["19:30"]   # India time
  short:
    publish_times: ["09:00", "21:00"]

visuals:
  # Tamil long videos keep the earlier layout: the News Package strap and tabs
  # are set in English. Tamil Shorts use Caption News in the Tamil font.
  style: classic
  fonts:                       # every text on every card, in Tamil (OFL)
    display: "assets/fonts/NotoSansTamil-Bold.ttf"
    body:    "assets/fonts/NotoSansTamil-Bold.ttf"
    mono:    "assets/fonts/NotoSansTamil-Bold.ttf"
    caption: "assets/fonts/NotoSansTamil-Bold.ttf"
  labels:
    source: ஆதாரம்
    number: முக்கிய எண்
    quote: அவர்கள் சொன்னது
    timeline: காலவரிசை
    data: தரவு
    document: ஆவணம்
    wordmark: டெர்மினல் வேல்யூ தமிழ்
