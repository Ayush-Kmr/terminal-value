# Stories for the Tamil channel, picked for Tamil viewers (Ayush, 2026-11-04:
# "no same content on the Tamil and English channels").
#
# A run with CHANNEL=ta-src picks today's Tamil Nadu stories and builds each
# one in English, without uploading it (narration, pictures and cards; the
# English pipeline is the tested one). The Tamil job then translates and
# re-narrates that build for the Tamil channel (CHANNEL=ta, --follow), like
# before, but on its own stories. History is shared with the Tamil channel
# (data/history.ta.json), so a story is never repeated there; the English
# channel's queue and stories are never used.
#
# Laid over config.yaml only (not channels/ta.yaml).

trending:
  cooldown_days: 10
  audience: "Tamil Nadu, India (Tamil-speaking viewers, including the Tamil diaspora)"
  audience_rules: |
    - Choose what Tamil viewers are searching for and sharing today: money and
      daily life in Tamil Nadu and India. Gold and silver rates, petrol and
      diesel, vegetable, milk and grocery prices, electricity (TNEB) tariffs,
      bus and metro fares, ration and state schemes (Magalir Urimai Thogai,
      pensions, EPFO, PF), loans, EMIs and RBI decisions, salaries, jobs and IT
      layoffs in Chennai and Coimbatore, new factories and investment in Tamil
      Nadu (Foxconn, Hyundai, Tata, Zoho, TVS, Ashok Leyland), big Indian
      companies, and the business of Tamil cinema (box office, OTT deals).
    - A world story qualifies only if it clearly changes money, prices or jobs
      in Tamil Nadu or India: crude oil and petrol, US tariffs and Tiruppur
      exports, H-1B rules and Chennai IT jobs.
    - Prefer a story trending in Tamil Nadu searches or Tamil news AND
      reported by several outlets. Frame it around what it changes for an
      ordinary family in Tamil Nadu. A big open question beats a recap.
    - A VIRAL line is a Tamil video doing big numbers on YouTube this week. If
      one with 100,000 views or more is about such a story and breaks none of
      the rules below, its subject goes FIRST.
  own_regions: []                  # the Tamil channel's own best videos, any region
  regions:
    - {code: TN, name: Tamil Nadu, weight: 1.0, language: en, trends_geo: IN-TN,
       news: {hl: ta, gl: IN}}
    - {code: IN, name: India money and jobs (Tamil Nadu first), weight: 0.8, language: en,
       news: {hl: en-IN, gl: IN, query: "(\"Tamil Nadu\" OR Chennai OR Coimbatore OR Madurai OR Tiruppur OR \"gold rate\" OR \"petrol price\" OR EPFO OR RBI) when:1d"}}
  avoid:
    - Deaths, accidents, disasters, attacks or crimes where victims are still being counted or named
    - Accusations against a named individual that no court or regulator has ruled on
    - Party politics, political leaders' statements and feuds, arrests of politicians; a government scheme or budget measure is fine
    - Communal, caste, language or religious conflict
    - Elections and campaigns at any time: candidates, races, debates, polls, ballots and results
    - Medical or health advice, including outbreaks and treatments
    - Active military operations where the facts are contested between governments
    - Sexual content, suicide or self-harm
    - Celebrity gossip, film trailers, reviews and fan fights, and sports of any kind, including cricket and the IPL (the business of cinema, such as box office and OTT money, is fine)
    - Which stock, fund or coin a viewer should buy, sell or hold
    - Stories with no clear effect on money, prices, jobs, companies or the economy

research:
  news_edition: {hl: en-IN, gl: IN}
  extra_editions: [{hl: ta, gl: IN}]
  bing_market: en-IN
  min_trusted: 2
  trusted_sources: [the hindu, thehindu, hindu tamil, hindutamil, businessline, times of india, timesofindia, indian express, indianexpress, new indian express, newindianexpress, ndtv, hindustan times, hindustantimes, livemint, mint, economic times, economictimes, business standard, business-standard, moneycontrol, deccan herald, india today, indiatoday, news18, the print, theprint, scroll, dt next, dtnext, dinamalar, dinamani, daily thanthi, dailythanthi, puthiya thalaimurai, vikatan, polimer, sun news, bbc, reuters, bloomberg, cnbc, financial express, financialexpress, pib.gov.in, rbi.org.in, tn.gov.in, wikipedia]

viral:
  region_code: IN
  language: ta
  ascii_only: false
  news_min_views: 100000
  news_queries: [tamil news today, gold rate today tamil, tamil nadu news, chennai news tamil]

queue:
  enabled: false                   # data/queue.yaml is the English channel's

format:
  long:
    days: [never]                  # Shorts only for now (Tamil long videos are paused)
  short:
    per_day: 1
    second: none                   # no evergreen or stock Short: today's Tamil story only
