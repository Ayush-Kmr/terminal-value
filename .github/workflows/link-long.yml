name: Link Shorts to long videos

# Puts a long-video link at the top of the top Shorts (scripts/link_long.py).
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Which channel"
        type: choice
        options: [main, bh]
        default: main
      dry_run:
        description: "Only list what would change"
        type: boolean
        default: true

jobs:
  link:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Link Shorts
        env:
          YT_CLIENT_ID:     ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ inputs.channel == 'bh' && (secrets.YT_REFRESH_TOKEN_BH || secrets.YT_REFRESH_TOKEN_TA) || secrets.YT_REFRESH_TOKEN }}
          CHANNEL:          ${{ inputs.channel == 'main' && '' || inputs.channel }}
        run: python scripts/link_long.py ${{ inputs.dry_run && '--dry-run' || '' }}
