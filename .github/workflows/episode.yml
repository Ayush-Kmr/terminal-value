name: Episode

on:
  schedule:
    # Every day 10:30 UTC = 16:00 IST. Alternate days: one long video on the
    # top story plus two Shorts cut from it. Other days: two standalone Shorts.
    # Everything goes public as soon as it uploads (upload.publish in config.yaml).
    # Narration is the owner's cloned voice, generated on the runner.
    - cron: "30 10 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Story to cover (leave blank to pick today's top trend)"
        required: false
      region:
        description: "Region for a manual topic: IN = Hindi; US, CN, RU, WORLD = English"
        type: choice
        options: [IN, US, CN, RU, WORLD]
        default: IN
      kind:
        description: "auto = follow config.yaml (long video on alternate days, two Shorts daily)"
        type: choice
        options: [auto, long, shorts]
        default: auto
      publish:
        description: "now = public as soon as it uploads; slot = hold for the next publish time"
        type: choice
        options: [now, slot]
        default: now
      count:
        description: "With kind = shorts: how many Shorts to make (blank = 2)"
        required: false
      no_upload:
        description: "Build only, do not upload"
        type: boolean
        default: false

concurrency:
  group: episode
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu

      - run: pip install -r requirements.txt

      # The cloned-voice model lives in its own environment (older torch/numpy).
      - name: Cache voice environment and model
        uses: actions/cache@v4
        with:
          path: |
            .venv-voice
            ~/.cache/huggingface
            ~/.pkuseg
          key: voice-${{ runner.os }}-${{ hashFiles('requirements-voice.txt') }}

      - name: Install cloned-voice model
        run: |
          if [ ! -x .venv-voice/bin/python ]; then
            python -m venv .venv-voice
            .venv-voice/bin/pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
            .venv-voice/bin/pip install -q -r requirements-voice.txt
          fi

      - name: Produce episode
        env:
          GEMINI_API_KEY:            ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:              ${{ secrets.GROQ_API_KEY }}
          ELEVENLABS_API_KEY:        ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID:       ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_VOICE_ID_IN:    ${{ secrets.ELEVENLABS_VOICE_ID_IN }}
          ELEVENLABS_VOICE_ID_US:    ${{ secrets.ELEVENLABS_VOICE_ID_US }}
          ELEVENLABS_VOICE_ID_CN:    ${{ secrets.ELEVENLABS_VOICE_ID_CN }}
          ELEVENLABS_VOICE_ID_RU:    ${{ secrets.ELEVENLABS_VOICE_ID_RU }}
          ELEVENLABS_VOICE_ID_WORLD: ${{ secrets.ELEVENLABS_VOICE_ID_WORLD }}
          CF_ACCOUNT_ID:             ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN:              ${{ secrets.CF_API_TOKEN }}
          PEXELS_API_KEY:            ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY:           ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID:              ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET:          ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN:          ${{ secrets.YT_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN:        ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:          ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC:                     ${{ inputs.topic }}
          REGION:                    ${{ inputs.region }}
          KIND:                      ${{ inputs.kind }}
          PUBLISH:                   ${{ inputs.publish }}
          COUNT:                     ${{ inputs.count }}
          NO_UPLOAD:                 ${{ inputs.no_upload }}
        run: |
          args=()
          [ -n "$TOPIC" ] && args+=(--topic "$TOPIC" --region "${REGION:-IN}")
          [ -n "$KIND" ] && args+=(--kind "$KIND")
          [ -n "$PUBLISH" ] && args+=(--publish "$PUBLISH")
          [ -n "$COUNT" ] && args+=(--count "$COUNT")
          [ "$NO_UPLOAD" = "true" ] && args+=(--no-upload)
          python main.py "${args[@]}"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode-${{ github.run_number }}
          path: |
            output/**/final.mp4
            output/**/thumbnail.jpg
            output/**/metadata.json
            output/**/script.json
            output/**/research.json
            output/**/shorts/*.mp4
          retention-days: 7

      - name: Commit history
        if: success()
        run: |
          git config user.name "terminal-value-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add data/history.json || true
          git diff --staged --quiet || git commit -m "chore: episode history [skip ci]"
          git pull --rebase -q || true
          git push || true
