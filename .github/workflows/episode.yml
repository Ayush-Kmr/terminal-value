name: Episode

# The English channel (Terminal Value). The Bhojpuri channel has its own
# workflow, bhojpuri.yml (split 2026-11-14), so a slow or failed skit run never
# holds up or fails the English one.

on:
  schedule:
    # Every day 03:30 UTC. Sunday: one long video per channel and no Shorts;
    # Monday-Saturday: four Shorts per channel. Uploads are scheduled for the
    # day's fixed slots (format.*.publish_times); GitHub often starts this
    # hours late, and a slot already gone then means public at once.
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Story to cover (leave blank to pick today's top trend)"
        required: false
      region:
        description: "Region for a manual topic (all narrated in English)"
        type: choice
        options: [US, MARKETS]
        default: US
      kind:
        description: "auto = follow config.yaml (long video on Sundays only, four Shorts Mon-Sat)"
        type: choice
        options: [auto, long, shorts]
        default: auto
      publish:
        description: "slot = go public at the next fixed publish time; now = public as soon as it uploads"
        type: choice
        options: [slot, now]
        default: slot
      count:
        description: "How many Shorts to make (blank = 4, minus any already up today); with kind = long, the Shorts made alongside it"
        required: false
      no_upload:
        description: "Build only, do not upload"
        type: boolean
        default: false

concurrency:
  group: episode
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.12"
          cache: pip

      # espeak-ng lets the voice pronounce names outside its dictionary.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu espeak-ng

      - run: pip install -r requirements.txt

      # The voice model lives in its own environment.
      - name: Cache voice environment and model
        uses: actions/cache@v4
        with:
          path: |
            .venv-kokoro
            ~/.cache/huggingface
          key: kokoro-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('requirements-kokoro.txt') }}

      - name: Install voice model
        run: |
          if ! .venv-kokoro/bin/python -c 'import sys' 2>/dev/null; then
            rm -rf .venv-kokoro
            python -m venv .venv-kokoro
            .venv-kokoro/bin/pip install -q torch --index-url https://download.pytorch.org/whl/cpu
            .venv-kokoro/bin/pip install -q -r requirements-kokoro.txt
          fi

      - name: Produce episode
        env:
          GEMINI_API_KEY:            ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:              ${{ secrets.GROQ_API_KEY }}
          XAI_API_KEY:               ${{ secrets.XAI_API_KEY }}
          OPENAI_API_KEY:            ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY:        ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID:       ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_VOICE_ID_IN:    ${{ secrets.ELEVENLABS_VOICE_ID_IN }}
          ELEVENLABS_VOICE_ID_US:    ${{ secrets.ELEVENLABS_VOICE_ID_US }}
          ELEVENLABS_VOICE_ID_CN:    ${{ secrets.ELEVENLABS_VOICE_ID_CN }}
          ELEVENLABS_VOICE_ID_RU:    ${{ secrets.ELEVENLABS_VOICE_ID_RU }}
          ELEVENLABS_VOICE_ID_WORLD: ${{ secrets.ELEVENLABS_VOICE_ID_WORLD }}
          CF_ACCOUNT_ID:             ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN:              ${{ secrets.CF_API_TOKEN }}
          PEXELS_API_KEY:            ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY:           ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID:              ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET:          ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN:          ${{ secrets.YT_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN:        ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:          ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC:                     ${{ inputs.topic }}
          REGION:                    ${{ inputs.region }}
          KIND:                      ${{ inputs.kind }}
          PUBLISH:                   ${{ inputs.publish }}
          COUNT:                     ${{ inputs.count }}
          NO_UPLOAD:                 ${{ inputs.no_upload }}
        run: |
          args=()
          [ -n "$TOPIC" ] && args+=(--topic "$TOPIC" --region "${REGION:-US}")
          [ -n "$KIND" ] && args+=(--kind "$KIND")
          [ -n "$PUBLISH" ] && args+=(--publish "$PUBLISH")
          [ -n "$COUNT" ] && args+=(--count "$COUNT")
          [ "$NO_UPLOAD" = "true" ] && args+=(--no-upload)
          python main.py "${args[@]}"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode-${{ github.run_number }}
          path: |
            output/**/shots.json
            output/**/assets/*
            !output/**/assets/*.frames
            !output/**/assets/*.frames/**
            output/**/final.mp4
            output/**/thumbnail*.jpg
            output/**/metadata.json
            output/**/script.json
            output/**/research.json
            output/**/shorts/*.mp4
            output/**/short.mp4
          retention-days: 7

      - name: Commit history
        if: success()
        run: |
          git config user.name "terminal-value-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add data/history.json || true
          git diff --staged --quiet || git commit -m "chore: episode history [skip ci]"
          git pull --rebase -q || true
          git push || true
