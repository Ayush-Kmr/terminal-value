name: Episode

on:
  schedule:
    # Mon and Thu 04:40 UTC = 10:10 IST. Produces a day ahead of the slot so
    # there is time for the review gate before Tuesday/Friday publication.
    - cron: "40 4 * * 1,4"
  workflow_dispatch:
    inputs:
      topic:
        description: "Company (leave blank to let the picker choose)"
        required: false
      no_upload:
        description: "Build only, do not upload"
        type: boolean
        default: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 330      # gates can wait on a human; see gates.timeout_hours
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu

      - run: pip install -r requirements.txt

      - name: Produce episode
        env:
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
          ELEVENLABS_API_KEY:  ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          CF_ACCOUNT_ID:       ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN:        ${{ secrets.CF_API_TOKEN }}
          PEXELS_API_KEY:      ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY:     ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID:        ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET:    ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN:    ${{ secrets.YT_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC:               ${{ inputs.topic }}
          NO_UPLOAD:           ${{ inputs.no_upload }}
        run: |
          args=()
          [ -n "$TOPIC" ] && args+=(--topic "$TOPIC")
          [ "$NO_UPLOAD" = "true" ] && args+=(--no-upload)
          python main.py "${args[@]}"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode-${{ github.run_number }}
          path: |
            output/**/final.mp4
            output/**/thumbnail.jpg
            output/**/metadata.json
            output/**/script.json
            output/**/research.json
            output/**/shorts/*.mp4
          retention-days: 14

      - name: Commit history
        if: success()
        run: |
          git config user.name "terminal-value-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add data/history.json || true
          git diff --staged --quiet || git commit -m "chore: episode history [skip ci]"
          git push || true
