name: Episode

on:
  schedule:
    # Every day 03:30 UTC = 09:00 IST. Alternate days: one long video on the
    # top story; every day: two standalone Shorts on the next stories.
    # Uploads are scheduled for fixed slots (format.*.publish_times in
    # config.yaml: long 19:00, Shorts 08:00 and 20:30 IST). GitHub often
    # starts scheduled runs hours late, so this fires early enough to finish
    # before the 19:00 slot even then.
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Story to cover (leave blank to pick today's top trend)"
        required: false
      region:
        description: "Region for a manual topic (all narrated in English)"
        type: choice
        options: [IN, US, CN, RU, WORLD]
        default: IN
      kind:
        description: "auto = follow config.yaml (long video on alternate days, two Shorts daily)"
        type: choice
        options: [auto, long, shorts]
        default: auto
      publish:
        description: "slot = go public at the next fixed publish time; now = public as soon as it uploads"
        type: choice
        options: [slot, now]
        default: slot
      count:
        description: "With kind = shorts: how many Shorts to make (blank = 2)"
        required: false
      no_upload:
        description: "Build only, do not upload"
        type: boolean
        default: false

concurrency:
  group: episode
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu

      - run: pip install -r requirements.txt

      # The cloned-voice model lives in its own environment (older torch/numpy).
      - name: Cache voice environment and model
        uses: actions/cache@v4
        with:
          path: |
            .venv-voice
            ~/.cache/huggingface
            ~/.pkuseg
          key: voice-${{ runner.os }}-${{ hashFiles('requirements-voice.txt') }}

      - name: Install cloned-voice model
        run: |
          if [ ! -x .venv-voice/bin/python ]; then
            python -m venv .venv-voice
            .venv-voice/bin/pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
            .venv-voice/bin/pip install -q -r requirements-voice.txt
          fi

      - name: Produce episode
        env:
          GEMINI_API_KEY:            ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:              ${{ secrets.GROQ_API_KEY }}
          ELEVENLABS_API_KEY:        ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID:       ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_VOICE_ID_IN:    ${{ secrets.ELEVENLABS_VOICE_ID_IN }}
          ELEVENLABS_VOICE_ID_US:    ${{ secrets.ELEVENLABS_VOICE_ID_US }}
          ELEVENLABS_VOICE_ID_CN:    ${{ secrets.ELEVENLABS_VOICE_ID_CN }}
          ELEVENLABS_VOICE_ID_RU:    ${{ secrets.ELEVENLABS_VOICE_ID_RU }}
          ELEVENLABS_VOICE_ID_WORLD: ${{ secrets.ELEVENLABS_VOICE_ID_WORLD }}
          CF_ACCOUNT_ID:             ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN:              ${{ secrets.CF_API_TOKEN }}
          PEXELS_API_KEY:            ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY:           ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID:              ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET:          ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN:          ${{ secrets.YT_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN:        ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:          ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC:                     ${{ inputs.topic }}
          REGION:                    ${{ inputs.region }}
          KIND:                      ${{ inputs.kind }}
          PUBLISH:                   ${{ inputs.publish }}
          COUNT:                     ${{ inputs.count }}
          NO_UPLOAD:                 ${{ inputs.no_upload }}
        run: |
          args=()
          [ -n "$TOPIC" ] && args+=(--topic "$TOPIC" --region "${REGION:-IN}")
          [ -n "$KIND" ] && args+=(--kind "$KIND")
          [ -n "$PUBLISH" ] && args+=(--publish "$PUBLISH")
          [ -n "$COUNT" ] && args+=(--count "$COUNT")
          [ "$NO_UPLOAD" = "true" ] && args+=(--no-upload)
          python main.py "${args[@]}"

      # Marks the folder the artifact is rooted at, so each build keeps its
      # folder name when the Tamil job downloads it.
      - run: mkdir -p output && echo "${{ github.run_id }}" > output/run.txt
        if: always()

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode-${{ github.run_number }}
          path: |
            output/run.txt
            output/**/shots.json
            output/**/assets/*
            !output/**/assets/*.frames
            !output/**/assets/*.frames/**
            output/**/final.mp4
            output/**/thumbnail.jpg
            output/**/metadata.json
            output/**/script.json
            output/**/research.json
            output/**/shorts/*.mp4
            output/**/short.mp4
          retention-days: 7

      - name: Commit history
        if: success()
        run: |
          git config user.name "terminal-value-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add data/history.json || true
          git diff --staged --quiet || git commit -m "chore: episode history [skip ci]"
          git pull --rebase -q || true
          git push || true

  # The Tamil channel: the same videos, translated and narrated in Tamil
  # (src/follow.py), uploaded with the Tamil channel's own token. Skipped
  # until the YT_REFRESH_TOKEN_TA secret exists.
  tamil:
    needs: produce
    if: ${{ !cancelled() && needs.produce.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Is the Tamil channel set up?
        id: on
        env:
          TOKEN: ${{ secrets.YT_REFRESH_TOKEN_TA }}
        run: |
          if [ -n "$TOKEN" ] || [ "${{ inputs.no_upload }}" = "true" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No YT_REFRESH_TOKEN_TA secret yet, so no Tamil videos. See SETUP.md, 'Tamil channel'."
          fi

      - uses: actions/checkout@v4
        if: steps.on.outputs.go

      - uses: actions/setup-python@v5
        if: steps.on.outputs.go
        with:
          python-version: "3.12"
          cache: pip

      # libraqm + libfribidi let Pillow shape Tamil script for the captions.
      - name: Install ffmpeg
        if: steps.on.outputs.go
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu libraqm0 libfribidi0

      - run: pip install -r requirements.txt
        if: steps.on.outputs.go

      - name: Cache Tamil voice environment and model
        if: steps.on.outputs.go
        uses: actions/cache@v4
        with:
          path: |
            .venv-indic
            ~/.cache/huggingface
          key: indic-${{ runner.os }}-${{ hashFiles('requirements-indic.txt') }}

      - name: Install Tamil voice model
        if: steps.on.outputs.go
        run: |
          if [ ! -x .venv-indic/bin/python ]; then
            python -m venv .venv-indic
            .venv-indic/bin/pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
            .venv-indic/bin/pip install -q -r requirements-indic.txt
          fi

      - uses: actions/download-artifact@v4
        if: steps.on.outputs.go
        with:
          name: episode-${{ github.run_number }}
          path: en-builds

      - name: Produce Tamil versions
        if: steps.on.outputs.go
        env:
          CHANNEL:            ta
          HF_TOKEN:           ${{ secrets.HF_TOKEN }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          CF_ACCOUNT_ID:      ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN:       ${{ secrets.CF_API_TOKEN }}
          PIXABAY_API_KEY:    ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID:       ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET:   ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN:   ${{ secrets.YT_REFRESH_TOKEN_TA }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          PUBLISH:            ${{ inputs.publish }}
          NO_UPLOAD:          ${{ inputs.no_upload }}
        run: |
          args=(--follow en-builds)
          [ -n "$PUBLISH" ] && args+=(--publish "$PUBLISH")
          [ "$NO_UPLOAD" = "true" ] && args+=(--no-upload)
          python main.py "${args[@]}"

      - name: Upload artifacts
        if: always() && steps.on.outputs.go
        uses: actions/upload-artifact@v4
        with:
          name: tamil-${{ github.run_number }}
          path: |
            output/ta/**/final.mp4
            output/ta/**/short.mp4
            output/ta/**/metadata.json
            output/ta/**/script.json
          retention-days: 7

      - name: Commit history
        if: success() && steps.on.outputs.go
        run: |
          git config user.name "terminal-value-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add data/history.ta.json || true
          git diff --staged --quiet || git commit -m "chore: tamil episode history [skip ci]"
          git pull --rebase -q || true
          git push || true
