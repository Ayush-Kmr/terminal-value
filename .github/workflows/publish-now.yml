name: Publish now

# Makes videos waiting for their scheduled slot public straight away.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Which channel"
        type: choice
        options: [main, ta]
        default: main

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Publish scheduled videos
        env:
          YT_CLIENT_ID:     ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ inputs.channel == 'ta' && secrets.YT_REFRESH_TOKEN_TA || secrets.YT_REFRESH_TOKEN }}
          CHANNEL:          ${{ inputs.channel }}
        run: python scripts/publish_now.py
