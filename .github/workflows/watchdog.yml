name: Watchdog

# Makes sure both channels really got videos today. GitHub sometimes starts the
# daily run hours late or not at all, so this checks what was uploaded, restarts
# whatever is missing, and reports in Telegram.
on:
  schedule:
    - cron: "0 13 * * *"       # 6:30 PM IST
    - cron: "0 20 * * *"       # 1:30 AM IST
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check today's uploads
        env:
          GH_TOKEN:           ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/watchdog.py
