name: Telegram bot

# Answers the bot's slash commands (/status, /english, /tamil, ...). There is
# no server: one run listens to Telegram for 5 h 45 min, then starts the next.
# GitHub delayed five-minute schedules by hours, which left commands unanswered.
# The hourly schedule only restarts the bot if that chain ever breaks.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: telegram
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Answer commands
        env:
          YT_CLIENT_ID:        ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET:    ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN:    ${{ secrets.YT_REFRESH_TOKEN }}
          YT_REFRESH_TOKEN_TA: ${{ secrets.YT_REFRESH_TOKEN_TA }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN:        ${{ github.token }}
        run: python scripts/telegram_bot.py --poll 20700

      - name: Start the next run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run telegram.yml --repo "$GITHUB_REPOSITORY" --ref main
