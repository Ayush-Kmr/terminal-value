name: Clean tags

# Removes off-topic tags from videos already published (scripts/clean_tags.py).
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Which channel"
        type: choice
        options: [main, ta]
        default: main
      dry_run:
        description: "Only list what would change"
        type: boolean
        default: true

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Clean tags
        env:
          YT_CLIENT_ID:     ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ inputs.channel == 'ta' && secrets.YT_REFRESH_TOKEN_TA || secrets.YT_REFRESH_TOKEN }}
          CHANNEL:          ${{ inputs.channel == 'main' && '' || inputs.channel }}
        run: python scripts/clean_tags.py ${{ inputs.dry_run && '--dry-run' || '' }}
