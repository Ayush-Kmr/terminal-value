# ============================================================
#  Channel configuration
#  Everything that defines the show lives here.
# ============================================================

# trending: pick the day's most-searched story and explain it (fully automatic)
# documentary: the original business rise-and-fall format (src/topics.py)
mode: trending

channel:
  name: "Terminal Value"           # display name
  handle: "@terminalvaluedoc"
  channel_id: "UCm1uFmKTwjzhIAUeYC0NcZQ"
  url: "https://www.youtube.com/@terminalvaluedoc"
  tagline: "The story behind the headline."
  schedule_line: "NEW VIDEO EVERY DAY"
  language: en                     # channel default; each video sets its own
  country: US                      # audience country shown on the About page
  timezone: America/New_York        # publish_times below are in this zone
  # The About box. Applied by scripts/brand_channel.py. The first two lines
  # are what search shows, so they carry the keywords.
  about: |
    US business and markets news, explained properly. The story behind the headline: what happened at America's biggest companies, how we got here, and what it means for your money, your job and the economy.

    We follow the stories Americans are searching for, from earnings and layoffs to the Fed, tariffs and AI deals, read the coverage, and explain each one in plain English with the numbers, the dates and the people involved.

    New explainer every other day at 12 PM ET. New Shorts every day at 9 AM and 5 PM ET.

    Every video lists its sources in the description. Scripts and narration are produced with AI from published news reporting. Nothing here is financial advice. If we get something wrong, tell us in the comments and we will correct it.
  # What Americans search for. Check against YouTube search suggestions.
  keywords:
    - business news
    - stock market news today
    - us economy explained
    - earnings explained
    - federal reserve explained
    - interest rates explained
    - tariffs explained
    - ai stocks news
    - tech layoffs
    - wall street news
    - inflation explained
    - company news today
  # Appended to every description. Keep it accurate: it tells viewers (and
  # YouTube) how the video was made.
  # Links shown under the call to action in every description, e.g.
  #   - "Daily brief on Telegram: https://t.me/..."
  #   - "Books we used (affiliate): https://amzn.to/..."
  # An affiliate link needs the disclosure in the line itself.
  links:
    - "Subscribe for the story behind the headline: https://www.youtube.com/@terminalvaluedoc?sub_confirmation=1"
  # Closes every description, before the sources.
  cta: >-
    New explainer every other day at 12 PM ET and two Shorts every day.
    Subscribe so you never miss the story behind the headline.
  disclosure: >-
    This video was produced with AI: the script was written and the narration
    synthesised by AI from the published news reports listed above. Corrections
    are welcome in the comments.

# ---------- trending topic selection ----------
trending:
  cooldown_days: 10                # do not repeat a story within this window
  # weight = priority. trends_geo = Google Trends country (not available for
  # China). news = Google News edition, or a search query for that region.
  regions:
    - {code: US, name: United States, weight: 1.0, language: en, trends_geo: US,
       news: {hl: en-US, gl: US}}
    - {code: MARKETS, name: US business and markets, weight: 1.0, language: en,
       news: {hl: en-US, gl: US, query: "prices OR rent OR housing OR \"car prices\" OR layoffs OR \"Federal Reserve\" OR tariffs OR stocks when:1d"}}
  # Stories an unattended pipeline must not narrate. These are also the
  # categories YouTube restricts ads on.
  # Checked in code after the model picks: a story using any of these words is
  # thrown out, whatever the model thought of it. Whole words, any case.
  block_words: [election, elections, midterm, midterms, candidate, candidates, congressional race, senate race, governor race, ballot, ballots, exit poll, voters, primary election, nfl, nba, mlb, nhl, ufc, ipl, super bowl, world series, playoffs, draft pick]
  avoid:
    - Deaths, accidents, disasters, attacks or crimes where victims are still being counted or named
    - Accusations against a named individual that no court or regulator has ruled on
    - Communal, caste or religious conflict
    - Elections and campaigns at any time: candidates, races, debates, polls, ballots and results
    - Medical or health advice, including outbreaks and treatments
    - Active military operations where the facts are contested between governments
    - Sexual content, suicide or self-harm
    - Pure celebrity gossip, film trailers, and sports of any kind, including fixtures, scores, drafts, auctions and transfers
    - Stories about another country unless they clearly move American companies, markets, jobs or prices
    - Which stock, fund or coin a viewer should buy, sell or hold
    - Stories with no clear effect on money, prices, jobs, companies, markets or the economy, such as natural hazards, science and space, engineering curiosities, and border or territorial disputes

# ---------- format ----------
format:
  kind: "news explainer video"     # how prompts describe the video
  long:
    days: []                    # weekdays a long video may go out. Empty = any day
    every_days: 2               # 2 = a long video on alternate days; 1 = every day
    # Every 3rd long video is an evergreen explainer from data/evergreen.yaml
    # (searched for month after month) instead of today's news. 0 = never.
    evergreen_every: 3
    # Every 2nd long video is a past business story already proven at a million
    # views (src/viral.py), told from our own research. 0 = never.
    history_every: 2
    # Over 8 minutes so the video can carry mid-roll ads once monetised.
    # A video that ends up under min_minutes is reported in Telegram.
    max_shot_words: 20          # longer shots are split, so the picture keeps moving
    # Near CNBC's 9-minute format, and still over 8 for mid-roll ads.
    target_minutes: 9
    min_minutes: 8
    words_per_minute: 140       # measured for the Kokoro voice
    publish_times: ["12:00"]    # ET, channel timezone. A starting point to test
  short:
    per_day: 2                  # two standalone Shorts every day, on the next
                                # stories after the long video's. Standalone
                                # Shorts outperformed cuts from the long ~5x.
    # Under 30 s: the Shorts that held 75-89% of viewers ran 22-35 s, and
    # 30-45 s is the length where completion drops most (Shorts playbook).
    max_shot_words: 12
    target_seconds: 28
    shot_seconds: [2.5, 5]      # a new picture about every 3 s keeps thumbs still
    publish_times: ["09:00", "17:00"]   # ET

# ---------- the explainer spine ----------
# Each video follows this structure but never the same phrasing.
structure:
  beats:
    - id: hook
      label: "The story"
      share: 0.08
      intent: "The single most striking verified fact of the story. Start in the middle of the event. No greeting, no channel name."
    - id: what_happened
      label: "What happened"
      share: 0.24
      intent: "Exactly what happened, in order, with dates, names and numbers. Inside the first 60 seconds of this section, name the surprising thing the video will reveal later, so the viewer has a reason to stay."
    - id: background
      label: "How we got here"
      share: 0.24
      intent: "The context a viewer needs to understand it. Only what the story depends on."
    - id: stakes
      label: "Why it matters"
      share: 0.24
      intent: "What this changes, and for whom. Make it concrete for an ordinary American: prices, paychecks, jobs, mortgages, car loans, 401(k)s."
    - id: whats_next
      label: "What happens next"
      share: 0.20
      intent: "What is confirmed to happen next, what is still unknown, and what to watch for. End on the open question, not on a moral. Do not ask for likes or subscriptions."

  # Long videos about the past (src/viral.py) use this spine instead.
  history_beats:
    - id: hook
      label: "The story"
      share: 0.08
      intent: "The single most striking verified fact of the story. Start at the moment it all went wrong. No greeting, no channel name."
    - id: rise
      label: "The rise"
      share: 0.24
      intent: "Who built this and how, with dates, names and numbers. Make the viewer understand why people believed in it. Inside the first 60 seconds of this section, tell the viewer what was hidden and that they will see how it was found."
    - id: crack
      label: "The crack"
      share: 0.24
      intent: "The decision or the flaw that started the fall, and who saw it first."
    - id: fall
      label: "The fall"
      share: 0.26
      intent: "How it came apart, in order, with dates and numbers, and who lost what."
    - id: legacy
      label: "What it changed"
      share: 0.18
      intent: "What changed afterwards for ordinary Americans: laws, jobs, prices, savings. End on what the story still explains today, not on a moral. Do not ask for likes or subscriptions."

  # A person's rise rather than a collapse.
  biography_beats:
    - id: hook
      label: "The story"
      share: 0.08
      intent: "The most striking verified moment of this person's life. Start in the middle of it. No greeting, no channel name."
    - id: beginnings
      label: "The beginning"
      share: 0.22
      intent: "Where they came from and what shaped them, with dates, places and numbers. Inside the first 60 seconds of this section, name the risky decision that is coming."
    - id: bet
      label: "The big bet"
      share: 0.26
      intent: "The risky decision that changed everything, and who doubted it."
    - id: empire
      label: "The empire"
      share: 0.26
      intent: "What they built, how it made money, and what it cost other people."
    - id: legacy
      label: "What it changed"
      share: 0.18
      intent: "What still touches ordinary Americans today because of this person. End on that, not on a moral. Do not ask for likes or subscriptions."

# ---------- proven demand on YouTube (src/viral.py) ----------
# Used only to choose subjects. Nothing is ever copied from these videos.
viral:
  news_days: 7
  news_min_views: 100000
  news_queries: [why is everything so expensive, us economy explained, stock market news, ai bubble]
  history_min_views: 1000000
  history_queries: [rise and fall of company documentary, biggest corporate scandal documentary, stock market crash history documentary, how he became the richest man documentary]
  history_avoid:
    - Anything mainly about a country other than the United States
  # Used when the search finds nothing, in this order.
  history_fallback:
    - {topic: "Enron", angle: "How did one of America's most admired companies turn out to be a fraud?", search_query: "Enron collapse", wiki_title: "Enron scandal", keywords: [enron scandal, what happened to enron]}
    - {topic: "Lehman Brothers", angle: "How did a 158-year-old bank collapse in a single weekend?", search_query: "Lehman Brothers bankruptcy", wiki_title: "Bankruptcy of Lehman Brothers", keywords: [lehman brothers collapse, 2008 financial crisis]}
    - {topic: "Blockbuster", angle: "How did Blockbuster go from 9,000 stores to one?", search_query: "Blockbuster bankruptcy", wiki_title: "Blockbuster (retailer)", keywords: [what happened to blockbuster, blockbuster vs netflix]}
    - {topic: "WorldCom", angle: "How did WorldCom hide billions in plain sight?", search_query: "WorldCom accounting scandal", wiki_title: "MCI Inc.", keywords: [worldcom scandal, bernie ebbers]}
    - {topic: "Theranos", angle: "How did Theranos convince investors with technology that did not work?", search_query: "Theranos fraud trial", wiki_title: "Theranos", keywords: [theranos explained, elizabeth holmes]}
    - {topic: "J.P. Morgan", collapse: false, angle: "How did one banker end up rescuing the US government?", search_query: "J.P. Morgan banker history", wiki_title: "J. P. Morgan", keywords: [jp morgan documentary, how jp morgan financed america]}
    - {topic: "Andrew Carnegie", collapse: false, angle: "How did a poor immigrant boy become the richest man in the world?", search_query: "Andrew Carnegie steel history", wiki_title: "Andrew Carnegie", keywords: [andrew carnegie documentary, how carnegie got rich]}
    - {topic: "Long-Term Capital Management", angle: "How did a hedge fund run by Nobel winners nearly break Wall Street?", search_query: "Long-Term Capital Management collapse", wiki_title: "Long-Term Capital Management", keywords: [ltcm collapse, hedge fund collapse 1998]}

# ---------- visual system ----------
# Motion graphics first. AI video is a garnish, not the meal.
visuals:
  resolution: [1920, 1080]
  fps: 30
  palette:
    bg:      "#0E1116"
    surface: "#161B22"
    ink:     "#F2F4F7"
    muted:   "#8B949E"
    accent:  "#E8B931"        # one accent colour, used sparingly, is a brand
    danger:  "#D1485A"
  fonts:
    display: "assets/fonts/Archivo-Black.ttf"
    body:    "assets/fonts/Inter-Regular.ttf"
    mono:    "assets/fonts/JetBrainsMono-Regular.ttf"
  grain: 0.035                 # film grain overlay; makes stock + AI blend together
  lower_thirds: true           # caption plate over photographs and clips
  shot_seconds: [4, 9]         # min/max per shot. Under 4s reads as slop.
  ai_video:
    enabled: false             # OFF by default. 12 min of AI video costs $30-65.
    max_seconds_per_episode: 30
    provider: wan              # cheapest credible: ~$0.07/sec
  mix_targets:                 # rough share of runtime per visual type
    motion_graphics: 0.45      # charts, timelines, stat reveals, quote cards
    archival_stock: 0.35       # Pexels/Pixabay/Wikimedia PD
    ai_illustration: 0.20      # stills, Ken Burns. NOT generated video.

# ---------- sound ----------
audio:
  music: true                  # background bed under the narration
  music_volume: 0.55           # 0 to 1. It drops further whenever the voice speaks
  # Beds live in assets/music/*.mp3; one is picked per video. The three there
  # were generated by scripts/make_music.py, so the channel owns them. Replace
  # them with any tracks you hold the rights to.

# ---------- voice ----------
voice:
  # kokoro     = Kokoro-82M, an open Apache-2.0 model run on the build machine.
  #              Clear American English, faster than real time, no per-character cost.
  # clone      = the channel owner's own voice, cloned by an open model that
  #              runs on the build machine. No per-character cost.
  # elevenlabs = ElevenLabs API (needs a paid plan for daily videos).
  provider: kokoro
  kokoro:
    voice: af_heart            # top-graded voice. Male alternative: am_michael
    speed: 1.0
    # Names the model gets wrong: word -> phonemes. Add new ones here.
    lexicon:
      Bloomberg: blˈumbəɹɡ
      Satya: sˈʌtjə
      Nadella: nədˈɛlə
      Jensen: ʤˈɛnsən
      Huang: hwˈɑŋ
      Palantir: pˈælənˌtɪɹ
      Powell: pˈWəl
      Altman: ˈɔltmən
      Zuckerberg: zˈʌkəɹbəɹɡ
      Bezos: bˈAzOs
      Dimon: dˈImən
      Nasdaq: nˈæzdæk
      Broadcom: bɹˈɔdkɑm
      IREN: ˈIɹɛn
      Bessent: bˈɛsənt
      Lutnick: lˈʌtnɪk
  pause_after_beat_ms: 650
  clone:
    # Clips cut from the owner's recording, one per narration language, so
    # Hindi is cloned from Hindi speech and English from English. The model
    # copies the room as well as the voice: these were run through a speech
    # enhancer to remove room echo. A close-mic recording in a quiet, soft
    # room would sound better still — replace these two files with 12 s each.
    references:
      hi: assets/voice/ref_hi.wav
      en: assets/voice/ref_en.wav
    settings:
      exaggeration: 0.5      # expressiveness. Higher is livelier but less stable
      cfg_weight: 0.5        # lower = slower, more deliberate pacing
      temperature: 0.7
  # ElevenLabs only:
  model: eleven_multilingual_v2
  stability: 0.45
  similarity_boost: 0.75
  style: 0.15
  # A different ElevenLabs narrator per region. Each value is the NAME of a
  # GitHub secret holding a voice ID; unset ones fall back to ELEVENLABS_VOICE_ID.
  voices:
    IN: ELEVENLABS_VOICE_ID_IN      # Hindi narrator
    US: ELEVENLABS_VOICE_ID_US
    CN: ELEVENLABS_VOICE_ID_CN
    RU: ELEVENLABS_VOICE_ID_RU
    WORLD: ELEVENLABS_VOICE_ID_WORLD

# ---------- research ----------
research:
  min_news_sources: 3          # trending mode: distinct outlets reporting the story
  min_trusted: 2               # a story needs this many outlets from the list below
  trusted_sources: [reuters, associated press, apnews, bloomberg, cnbc, wsj, wall street journal, financial times, ft.com, new york times, nytimes, washington post, marketwatch, barron, forbes, fortune, yahoo finance, finance.yahoo, sec.gov, federalreserve, bls.gov, bbc, guardian, axios, business insider, businessinsider, techcrunch, the verge, npr, cnn, abc news, nbc news, cbs news, fox business, economist, investopedia, wikipedia]
  blocked_sources: [crypto, coin, altcoin, biggo, blockchain, bitcoin, reddit, quora, medium.com, substack, prnewswire, globenewswire, stock picks, penny]
  min_sources: 5
  require_primary: true        # at least one filing, transcript, or court document
  banned_sole_source: [wikipedia]   # Wikipedia may start research, never finish it
  source_priority:
    - sec_filings
    - court_records
    - earnings_transcripts
    - major_press
    - books
    - wikipedia

# ---------- topic selection ----------
topics:
  competitors:                 # used for outlier detection, not imitation
    - "@CompanyMan"
    - "@ModernMBA"
    - "@BusinessCasual"
    - "@BrightSunFilms"
  outlier_threshold: 2.5       # a video is an outlier at 2.5x ITS OWN channel median
  cooldown_days: 365           # never repeat a company within a year
  min_company_age_years: 5

# ---------- other languages ----------
# Translated titles on every video, subtitles on long ones. Each caption costs
# 400 units of the 10,000 daily YouTube API quota: remove a language if uploads
# ever fail with quotaExceeded.
localize:
  languages: {es: Spanish, hi: Hindi}

# ---------- human gates ----------
# Both off: the pipeline picks, produces and publishes with nobody in the loop.
# Turn either on to get Telegram approval buttons back. A run that fails or is
# kept private by YouTube still reports to Telegram either way.
gates:
  topic_approval: false
  final_review: false
  channel: telegram
  timeout_hours: 2             # per gate; a GitHub job is killed at 6h
  on_timeout: hold

# ---------- upload ----------
upload:
  publish: slot                # slot = upload private, go public at the next
                               # publish_times slot (same time every day, so
                               # viewers learn when to expect it); now = at once
  category_id: 25              # News & Politics
  category_explainer: 27       # Education: history films and evergreen explainers
  series_playlist: "How It Collapsed"   # the history films
  made_for_kids: false
  synthetic_media_disclosure: true
  playlists:                   # one playlist per narration language
    hi: "हिंदी में — Explained"
    en: "Explained in English"
  # Topic playlists: a video joins every playlist one of whose words appears
  # in its subject, title or tags (whole words, any case). Keeps viewers
  # watching the next video on the same subject.
  # Category hashtag for each topic playlist.
  hashtags:
    "Stock Market & Companies": "#stockmarket"
    "AI & Big Tech": "#ai"
    "Fed, Banks & Interest Rates": "#interestrates"
    "Trade, Tariffs & Deals": "#tariffs"
    "Economy & Jobs": "#economy"
  topic_playlists:
    "Stock Market & Companies": [stock, stocks, share, shares, nasdaq, dow, ipo, market, markets, investors, earnings, profit, layoffs, ceo, startup, valuation, bear, bull]
    "AI & Big Tech": [ai, nvidia, openai, anthropic, microsoft, google, apple, amazon, meta, tesla, chip, chips, semiconductor, spacex]
    "Fed, Banks & Interest Rates": [fed, federal, powell, bank, banks, banking, rate, rates, mortgage, inflation, loan, loans, credit, treasury, gold]
    "Trade, Tariffs & Deals": [trade, tariff, tariffs, export, exports, import, imports, sanctions, oil, wto]
    "Economy & Jobs": [economy, economic, recession, jobs, unemployment, wages, gdp, consumer, dollar, debt, deficit]
