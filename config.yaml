# ============================================================
#  Channel configuration
#  Everything that defines the show lives here.
# ============================================================

# trending: pick the day's most-searched story and explain it (fully automatic)
# documentary: the original business rise-and-fall format (src/topics.py)
mode: trending

channel:
  name: "Terminal Value"           # display name
  handle: "@terminalvaluedoc"
  channel_id: "UCm1uFmKTwjzhIAUeYC0NcZQ"
  url: "https://www.youtube.com/@terminalvaluedoc"
  tagline: "The story behind the headline."
  schedule_line: "NEW VIDEO EVERY DAY"
  language: en                     # channel default; each video sets its own
  country: IN                      # audience country shown on the About page
  timezone: Asia/Kolkata
  # The About box. Applied by scripts/brand_channel.py. The first two lines
  # are what search shows, so they carry the keywords.
  about: |
    India and world business news, explained properly. The story behind the headline: what happened, how we got here, and what it means for your money, your job and the economy.

    Every day we pick the story India and the world are searching for, read all the coverage, and explain it in plain English with the numbers, the dates and the people involved.

    New explainer every other day at 7 PM IST. New Shorts every day at 8 AM and 8:30 PM IST.

    Every video lists its sources in the description. Scripts and narration are produced with AI from published news reporting. If we get something wrong, tell us in the comments and we will correct it.
  # From YouTube search suggestions (what people actually type), 2026-10-22.
  keywords:
    - business news india
    - business news today
    - stock market news today
    - share market news today english
    - economy explained
    - india us trade deal latest news
    - tariffs explained
    - gold price news
    - china economy explained
    - india inflation latest news
    - layoffs in india
    - rbi repo rate news today
  # Appended to every description. Keep it accurate: it tells viewers (and
  # YouTube) how the video was made.
  # Closes every description, before the sources.
  cta: >-
    New explainer every other day at 7 PM IST and two Shorts every day.
    Subscribe so you never miss the story behind the headline.
  disclosure: >-
    This video was produced with AI: the script was written and the narration
    synthesised by AI from the published news reports listed above. Corrections
    are welcome in the comments.

# ---------- trending topic selection ----------
trending:
  cooldown_days: 10                # do not repeat a story within this window
  # weight = priority. trends_geo = Google Trends country (not available for
  # China). news = Google News edition, or a search query for that region.
  regions:
    - {code: IN, name: India, weight: 1.0, language: en, trends_geo: IN,
       news: {hl: en-IN, gl: IN}}
    - {code: US, name: United States, weight: 0.8, language: en, trends_geo: US,
       news: {hl: en-US, gl: US}}
    - {code: CN, name: China, weight: 0.65, language: en,
       news: {hl: en-IN, gl: IN, query: "China when:1d"}}
    - {code: RU, name: Russia, weight: 0.65, language: en, trends_geo: RU,
       news: {hl: en-IN, gl: IN, query: "Russia when:1d"}}
    - {code: WORLD, name: Rest of world, weight: 0.5, language: en,
       news: {hl: en-IN, gl: IN, query: "world news when:1d"}}
  # Stories an unattended pipeline must not narrate. These are also the
  # categories YouTube restricts ads on.
  avoid:
    - Deaths, accidents, disasters, attacks or crimes where victims are still being counted or named
    - Accusations against a named individual that no court or regulator has ruled on
    - Communal, caste or religious conflict
    - An election in its voting or counting period, and opinion-poll or exit-poll claims
    - Medical or health advice, including outbreaks and treatments
    - Active military operations where the facts are contested between governments
    - Sexual content, suicide or self-harm
    - Pure celebrity gossip, film trailers, sports fixtures and match scores
    - Stories with no clear effect on money, prices, jobs, companies, markets or the economy, such as natural hazards, science and space, engineering curiosities, and border or territorial disputes

# ---------- format ----------
format:
  kind: "news explainer video"     # how prompts describe the video
  long:
    days: []                    # weekdays a long video may go out. Empty = any day
    every_days: 2               # 2 = a long video on alternate days; 1 = every day
    # Over 8 minutes so the video can carry mid-roll ads once monetised.
    # The narration runs faster than 150 words a minute (a 9.5-minute script
    # came out at 8:28), so aim well above the line. A video that still ends
    # up under min_minutes is reported in Telegram.
    target_minutes: 10.5
    min_minutes: 8
    words_per_minute: 150
    publish_times: ["19:00"]    # IST. Evening is the daily viewing peak in India
  short:
    per_day: 2                  # two standalone Shorts every day, on the next
                                # stories after the long video's. Standalone
                                # Shorts outperformed cuts from the long ~5x.
    # Under 30 s: the Shorts that held 75-89% of viewers ran 22-35 s, and
    # 30-45 s is the length where completion drops most (Shorts playbook).
    target_seconds: 28
    shot_seconds: [2.5, 5]      # a new picture about every 3 s keeps thumbs still
    publish_times: ["08:00", "20:30"]   # IST

# ---------- the explainer spine ----------
# Each video follows this structure but never the same phrasing.
structure:
  beats:
    - id: hook
      label: "The story"
      share: 0.08
      intent: "The single most striking verified fact of the story. Start in the middle of the event. No greeting, no channel name."
    - id: what_happened
      label: "What happened"
      share: 0.24
      intent: "Exactly what happened, in order, with dates, names and numbers."
    - id: background
      label: "How we got here"
      share: 0.24
      intent: "The context a viewer needs to understand it. Only what the story depends on."
    - id: stakes
      label: "Why it matters"
      share: 0.24
      intent: "What this changes, and for whom. Make it concrete for an ordinary viewer in India: prices, jobs, money, travel, security."
    - id: whats_next
      label: "What happens next"
      share: 0.20
      intent: "What is confirmed to happen next, what is still unknown, and what to watch for. End on the open question, not on a moral. Do not ask for likes or subscriptions."

# ---------- visual system ----------
# Motion graphics first. AI video is a garnish, not the meal.
visuals:
  resolution: [1920, 1080]
  fps: 30
  palette:
    bg:      "#0E1116"
    surface: "#161B22"
    ink:     "#F2F4F7"
    muted:   "#8B949E"
    accent:  "#E8B931"        # one accent colour, used sparingly, is a brand
    danger:  "#D1485A"
  fonts:
    display: "assets/fonts/Archivo-Black.ttf"
    body:    "assets/fonts/Inter-Regular.ttf"
    mono:    "assets/fonts/JetBrainsMono-Regular.ttf"
  grain: 0.035                 # film grain overlay; makes stock + AI blend together
  lower_thirds: true           # caption plate over photographs and clips
  shot_seconds: [4, 9]         # min/max per shot. Under 4s reads as slop.
  ai_video:
    enabled: false             # OFF by default. 12 min of AI video costs $30-65.
    max_seconds_per_episode: 30
    provider: wan              # cheapest credible: ~$0.07/sec
  mix_targets:                 # rough share of runtime per visual type
    motion_graphics: 0.45      # charts, timelines, stat reveals, quote cards
    archival_stock: 0.35       # Pexels/Pixabay/Wikimedia PD
    ai_illustration: 0.20      # stills, Ken Burns. NOT generated video.

# ---------- sound ----------
audio:
  music: true                  # background bed under the narration
  music_volume: 0.7            # 0 to 1. It drops further whenever the voice speaks
  # Beds live in assets/music/*.mp3; one is picked per video. The three there
  # were generated by scripts/make_music.py, so the channel owns them. Replace
  # them with any tracks you hold the rights to.

# ---------- voice ----------
voice:
  # clone      = the channel owner's own voice, cloned by an open model that
  #              runs on the build machine. No per-character cost.
  # elevenlabs = ElevenLabs API (needs a paid plan for daily videos).
  provider: clone
  pause_after_beat_ms: 650
  clone:
    # Clips cut from the owner's recording, one per narration language, so
    # Hindi is cloned from Hindi speech and English from English. The model
    # copies the room as well as the voice: these were run through a speech
    # enhancer to remove room echo. A close-mic recording in a quiet, soft
    # room would sound better still — replace these two files with 12 s each.
    references:
      hi: assets/voice/ref_hi.wav
      en: assets/voice/ref_en.wav
    settings:
      exaggeration: 0.5      # expressiveness. Higher is livelier but less stable
      cfg_weight: 0.5        # lower = slower, more deliberate pacing
      temperature: 0.7
  # ElevenLabs only:
  model: eleven_multilingual_v2
  stability: 0.45
  similarity_boost: 0.75
  style: 0.15
  # A different ElevenLabs narrator per region. Each value is the NAME of a
  # GitHub secret holding a voice ID; unset ones fall back to ELEVENLABS_VOICE_ID.
  voices:
    IN: ELEVENLABS_VOICE_ID_IN      # Hindi narrator
    US: ELEVENLABS_VOICE_ID_US
    CN: ELEVENLABS_VOICE_ID_CN
    RU: ELEVENLABS_VOICE_ID_RU
    WORLD: ELEVENLABS_VOICE_ID_WORLD

# ---------- research ----------
research:
  min_news_sources: 3          # trending mode: distinct outlets reporting the story
  min_sources: 5
  require_primary: true        # at least one filing, transcript, or court document
  banned_sole_source: [wikipedia]   # Wikipedia may start research, never finish it
  source_priority:
    - sec_filings
    - court_records
    - earnings_transcripts
    - major_press
    - books
    - wikipedia

# ---------- topic selection ----------
topics:
  competitors:                 # used for outlier detection, not imitation
    - "@CompanyMan"
    - "@ModernMBA"
    - "@BusinessCasual"
    - "@BrightSunFilms"
  outlier_threshold: 2.5       # a video is an outlier at 2.5x ITS OWN channel median
  cooldown_days: 365           # never repeat a company within a year
  min_company_age_years: 5

# ---------- human gates ----------
# Both off: the pipeline picks, produces and publishes with nobody in the loop.
# Turn either on to get Telegram approval buttons back. A run that fails or is
# kept private by YouTube still reports to Telegram either way.
gates:
  topic_approval: false
  final_review: false
  channel: telegram
  timeout_hours: 2             # per gate; a GitHub job is killed at 6h
  on_timeout: hold

# ---------- upload ----------
upload:
  publish: slot                # slot = upload private, go public at the next
                               # publish_times slot (same time every day, so
                               # viewers learn when to expect it); now = at once
  category_id: 25              # News & Politics
  made_for_kids: false
  synthetic_media_disclosure: true
  playlists:                   # one playlist per narration language
    hi: "हिंदी में — Explained"
    en: "Explained in English"
  # Topic playlists: a video joins every playlist one of whose words appears
  # in its subject, title or tags (whole words, any case). Keeps viewers
  # watching the next video on the same subject.
  topic_playlists:
    "Stock Market & Companies": [stock, stocks, share, shares, sensex, nifty, ipo, market, markets, investors, earnings, profit, layoffs, jobs, ceo, startup, valuation, bear, bull]
    "Banking, RBI & the Rupee": [rbi, bank, banks, banking, repo, rate, rates, rupee, inflation, loan, loans, sebi, credit, gold]
    "Trade, Tariffs & Deals": [trade, tariff, tariffs, export, exports, import, imports, fta, sanctions, oil, wto]
    "China & Global Economy": [china, chinese, us, usa, america, russia, europe, imf, global, world, recession, fed, dollar]
