# Evergreen explainers: every format.long.evergreen_every-th long video is
# the next unused topic here instead of today's news. Each one answers a
# question Americans keep searching for; news gets views for days, these for
# months. Add topics at the bottom; used ones are tracked in data/history.json.
topics:
  - topic: "The Fed"
    angle: "What does the Federal Reserve actually do, and how does a rate change reach your mortgage and credit card?"
    search: [what does the federal reserve do, how do interest rates work]
  - topic: "Inflation"
    angle: "What is inflation, how is it measured, and why does it eat your savings?"
    search: [what is inflation, how is inflation measured]
  - topic: "Recession"
    angle: "What is a recession, who decides when one starts, and what happens to jobs?"
    search: [what is a recession, who declares a recession]
  - topic: "Stock market"
    angle: "How does the US stock market actually work, from your order to the exchange?"
    search: [how does the stock market work, stock market explained]
  - topic: "S&P 500"
    angle: "What is the S&P 500, who decides what is in it, and why does everyone quote it?"
    search: [what is the s&p 500, s&p 500 explained]
  - topic: "Bull and bear markets"
    angle: "What are bull and bear markets, and what does history say about how long they last?"
    search: [what is a bear market, bull vs bear market]
  - topic: "IPO"
    angle: "What is an IPO, how does it work, and why do some stocks fall on day one?"
    search: [what is an ipo, how does an ipo work]
  - topic: "Short selling"
    angle: "What is short selling, how does a short squeeze happen, and who gets hurt?"
    search: [what is short selling, short squeeze explained]
  - topic: "National debt"
    angle: "What is the US national debt, who is it owed to, and does it matter?"
    search: [us national debt explained, who owns the us debt]
  - topic: "US dollar"
    angle: "Why is the dollar the world's reserve currency, and what could change that?"
    search: [why is the us dollar so strong, reserve currency explained]
  - topic: "Treasury yields"
    angle: "What are Treasury yields, and why do they move your mortgage rate?"
    search: [what are treasury yields, treasury yields explained]
  - topic: "Layoffs"
    angle: "Why do companies announce layoffs when profits are up, and why does the stock often rise?"
    search: [why do companies do layoffs, why stock goes up after layoffs]
  - topic: "Stock buybacks"
    angle: "What is a stock buyback, and why do companies spend billions on them?"
    search: [what is a stock buyback, stock buybacks explained]
  - topic: "How banks make money"
    angle: "How do banks make money from your deposits and loans?"
    search: [how banks make money, how do banks work]
  - topic: "How Nvidia makes money"
    angle: "How does Nvidia actually make its money, and why does the AI boom depend on it?"
    search: [how nvidia makes money, why is nvidia so valuable]
  - topic: "How Amazon makes money"
    angle: "How does Amazon actually make its money, business by business?"
    search: [how amazon makes money, amazon business model explained]
