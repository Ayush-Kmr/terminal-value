# Skit premises for the Bhojpuri comedy channel (src/skit.py). One is used per
# skit and never repeated; when all are used the model invents a new one.
# months: optional, the premise is picked first in those months (1-12).
# dates: optional, the premise runs only on those days (India time) and first;
#   this week's festival skits (docs/BHOJPURI-WEEK-PLAN.md).
# cast: who is in it (keys of skit.characters in channels/bh.yaml).
ideas:
  # ---- Fufa Ji series (added 2026-11-10): the easily offended brother-in-law ----
  # lead: who speaks first, so the skit joins that character's numbered series.
  - id: fufa-wedding-sulk
    premise: Fufa Ji arrives for a family wedding and sulks because nobody touched his feet first; the whole family tries one silly trick after another to un-offend him.
    cast: [fufa, lallan, phoolmati]
    lead: fufa
    months: [11, 12]
  - id: fufa-wifi-password
    premise: Fufa Ji is offended that Bablu changed the WiFi password and did not tell him first, and demands it be named after him.
    cast: [fufa, bablu]
    lead: fufa
  - id: fufa-vip-chair
    premise: Fufa Ji refuses to eat until he gets "his" special chair, which Chacha secretly sold last year; Chachi disguises a bucket as the chair.
    cast: [fufa, lallan, phoolmati]
    lead: fufa
  - id: fufa-photo-frame
    premise: In the family wedding photo Fufa Ji is standing at the edge, so he declares the photo invalid and demands a reshoot with himself in the middle.
    cast: [fufa, bablu, lallan]
    lead: fufa
  - id: fufa-extra-week
    premise: Fufa Ji came for two days and is now in his third week; Chacha and Chachi plan increasingly silly ways to make him go home without offending him.
    cast: [fufa, lallan, phoolmati]
    lead: lallan
  - id: fufa-laddoo-count
    premise: Fufa Ji counts the laddoos on every guest's plate and is offended he got one less than the groom's uncle.
    cast: [fufa, phoolmati]
    lead: fufa
  - id: fufa-reels-star
    premise: Bablu makes a reel of Fufa Ji sulking and it goes viral; now Fufa Ji is offended he was not paid, and then offended it is not viral enough.
    cast: [fufa, bablu]
    lead: bablu
  - id: fufa-baraat-dance
    premise: At the baraat nobody pulled Fufa Ji onto the dance floor, so he sulks at the side; when they finally do, he refuses to stop dancing.
    cast: [fufa, lallan, bablu]
    lead: fufa
    months: [11, 12]
  # ---- week of 2026-11-09: Diwali -> Bhai Dooj -> Chhath ----
  - id: diwali-leftover-mithai
    premise: The day after Diwali, Chacha hides the leftover sweets all over the house "for safety", forgets where, and Chachi finds them one by one in very silly places.
    cast: [lallan, phoolmati]
    dates: [2026-11-09]
  - id: bhai-dooj-gift
    premise: On Bhai Dooj, Bablu has no money for a gift for his sister, so he "gifts" her a free online course link; Chachi makes him pay in a funnier way.
    cast: [bablu, phoolmati, lallan]
    dates: [2026-11-10, 2026-11-11]
  - id: chhath-thekua
    premise: Chhath preparations; Chacha insists on making the thekua himself because he saw a cooking reel, and the kitchen turns into a battlefield.
    cast: [lallan, phoolmati, bablu]
    dates: [2026-11-12, 2026-11-13]
  - id: chhath-train-home
    premise: Everyone is rushing home to Bihar for Chhath; Bablu calls from the packed train and Chacha gives him "expert" advice on finding a seat.
    cast: [bablu, lallan]
    dates: [2026-11-12, 2026-11-13, 2026-11-14]
  - id: chhath-ghat-selfie
    premise: At the Chhath ghat, Bablu wants the perfect selfie with the sunset while Chachi tries to keep the family focused on the puja, and Chacha photobombs every shot.
    cast: [bablu, phoolmati, lallan]
    dates: [2026-11-14, 2026-11-15]
  - id: wedding-card-arrives
    premise: Wedding season begins; the first wedding card of the season arrives and Chacha plans which relative's wedding has the best food, like a general planning a war.
    cast: [lallan, phoolmati]
    dates: [2026-11-15, 2026-11-16]
  - id: chacha-selfie
    premise: Lallan Chacha gets his first smartphone and cannot understand why every photo shows his own face (the front camera is on).
    cast: [lallan, bablu]
  - id: chachi-serial
    premise: Phoolmati Chachi's TV serial is about to reveal the villain when the power goes off; she blames Lallan Chacha for everything.
    cast: [phoolmati, lallan]
  - id: bablu-influencer
    premise: Bablu wants to become a famous reels influencer and makes Chacha act in his video, but Chacha keeps looking straight into the camera and saying hello.
    cast: [bablu, lallan]
  - id: whatsapp-forward
    premise: Chacha believes a WhatsApp forward that says drinking tea upside down cures everything, and Chachi catches him trying it.
    cast: [lallan, phoolmati]
  - id: wifi-password
    premise: The whole village thinks Bablu's WiFi password is a secret mantra; Chacha tries to say it to the buffalo.
    cast: [lallan, bablu]
  - id: wedding-feast
    premise: At a village wedding, Chacha plans to eat at every counter before the food finishes, but Chachi has a plan of her own.
    cast: [lallan, phoolmati]
    months: [11, 12, 1, 2]
  - id: exam-result
    premise: Bablu's exam result is out and he tries to convince Chacha that 35 percent is actually a very high score.
    cast: [bablu, lallan, phoolmati]
    months: [4, 5, 6]
  - id: online-shopping
    premise: Chachi orders a saree online and Chacha thinks the delivery boy is a thief; Bablu has to explain cash on delivery.
    cast: [phoolmati, lallan, bablu]
  - id: chhath-ghat
    premise: Chacha wants to reserve the best spot on the Chhath ghat a week early and ties his gamchha there; the whole family has to guard it.
    cast: [lallan, phoolmati, bablu]
    months: [10, 11]
  - id: voice-assistant
    premise: Bablu sets up a voice assistant and Chacha argues with it like a real person because it will not understand Bhojpuri.
    cast: [lallan, bablu]
  - id: gym-chacha
    premise: Chacha decides to join a gym to impress Chachi and treats every machine like a farm tool.
    cast: [lallan, phoolmati]
  - id: power-cut-summer
    premise: A summer power cut; Chacha invents a fan run by Bablu cycling, and Bablu negotiates his pay.
    cast: [lallan, bablu]
    months: [5, 6, 7]
  - id: monsoon-roof
    premise: The roof leaks in the monsoon and Chacha says it is not a leak, it is a free shower; Chachi is not amused.
    cast: [lallan, phoolmati]
    months: [7, 8, 9]
  - id: holi-colour
    premise: On Holi, Chacha swears nobody will colour him this year and hides inside a drum; Bablu finds him with a drone.
    cast: [lallan, bablu]
    months: [3]
  - id: diet-plan
    premise: The doctor puts Chacha on a diet, and he tries to prove that litti chokha counts as a salad.
    cast: [lallan, phoolmati]
  - id: video-call
    premise: Chachi's first video call with her sister; she holds the phone to her ear and shouts, and Chacha gives wrong advice.
    cast: [phoolmati, lallan]
  - id: upi-payment
    premise: Chacha pays the vegetable seller by scanning the QR code with the phone held upside down and insists the money went to the moon.
    cast: [lallan, bablu]
  - id: train-ticket
    premise: Chacha and Chachi travel by train for the first time in years; Chacha argues with the ticket checker that his gamchha reserved the seat.
    cast: [lallan, phoolmati]
  - id: bablu-job
    premise: Bablu tells the family he got a job "work from home" and Chacha thinks it means he will be doing the housework.
    cast: [bablu, lallan, phoolmati]
  - id: buffalo-insurance
    premise: Chacha wants to buy life insurance for his buffalo and fills the form himself, with hilarious answers.
    cast: [lallan, bablu]
  - id: chachi-cricket
    premise: The cricket match is on; Chachi does not understand cricket but keeps predicting every wicket correctly, driving Chacha mad.
    cast: [phoolmati, lallan]
  - id: auto-correct
    premise: Chacha sends a romantic message to Chachi but auto-correct changes every word, and she reads it out loud to the whole family.
    cast: [lallan, phoolmati, bablu]
  - id: guest-arrives
    premise: Unexpected relatives are coming; Chacha and Bablu try every trick to pretend nobody is at home.
    cast: [lallan, bablu, phoolmati]
  - id: chacha-english
    premise: Chacha wants to speak English to impress a city guest and translates Bhojpuri sayings word for word.
    cast: [lallan, bablu]
  - id: ludo-fight
    premise: A game of online Ludo between Chacha and Chachi turns into a full family court case.
    cast: [lallan, phoolmati, bablu]
  - id: weather-app
    premise: Chacha trusts his knee pain more than Bablu's weather app to forecast rain; they bet a samosa on it.
    cast: [lallan, bablu]
  - id: fake-diet-chachi
    premise: Chachi announces she is fasting for health, but every few minutes she "just tastes" something in the kitchen.
    cast: [phoolmati, lallan]
  - id: bablu-haircut
    premise: Bablu comes home with a trendy haircut and Chacha thinks a crow attacked him.
    cast: [bablu, lallan, phoolmati]
  - id: tractor-gps
    premise: Bablu puts GPS on Chacha's phone to find the market, and the voice keeps saying "turn left" into a pond.
    cast: [lallan, bablu]
  - id: ai-chacha
    premise: Bablu shows Chacha an AI chatbot; Chacha asks it to find a good bride for Bablu and the AI asks too many questions.
    cast: [lallan, bablu]
  - id: chachi-ringtone
    premise: Chachi sets a loud devotional ringtone and it goes off at the worst moment while Chacha pretends to be asleep to avoid work.
    cast: [phoolmati, lallan]
  - id: diwali-cleaning
    premise: Diwali cleaning day; Chacha keeps "finding" old things he refuses to throw away, including a broken radio he talks to.
    cast: [lallan, phoolmati]
    months: [10, 11]
  - id: winter-bath
    premise: In the cold winter, Chacha invents a hundred excuses to skip his bath; Chachi has a bucket ready.
    cast: [lallan, phoolmati]
    months: [12, 1, 2]
  - id: bablu-girlfriend
    premise: Bablu is secretly on a phone call with his friend and Chachi thinks he is talking to a girl; the whole house listens in.
    cast: [bablu, phoolmati, lallan]
  - id: lottery-dream
    premise: Chacha dreams he won one crore rupees and starts spending it at breakfast, until Chachi brings him back to earth.
    cast: [lallan, phoolmati]
  - id: kite-festival
    premise: Makar Sankranti; Chacha claims he was the kite champion of the district and his kite gets stuck on the first try.
    cast: [lallan, bablu]
    months: [1]
  - id: password-forgot
    premise: Chacha changes his phone password to keep it "safe" and forgets it, then tries every family member's birthday.
    cast: [lallan, bablu, phoolmati]
  - id: mango-tree
    premise: Mango season; Chacha guards the mango tree all night, and Bablu tries to sneak mangoes with a drone and a fishing rod.
    cast: [lallan, bablu]
    months: [5, 6, 7]
  - id: doctor-online
    premise: Chachi books an online doctor appointment and the doctor sees only Chacha's moustache through the camera.
    cast: [phoolmati, lallan]
  - id: new-scooter
    premise: Chacha buys an electric scooter and keeps looking for where to put petrol; Bablu teaches him to ride it.
    cast: [lallan, bablu]
