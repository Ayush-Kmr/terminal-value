# Stories that go ahead of the automatic picks, top first. A story leaves the
# queue once it has been uploaded (tracked in data/history.json); then the
# automatic picks carry on. Add stories at the bottom, or move them up.
# A title is used only if every figure in it is in the research.
# not_before holds a story back until that date, for anything timed to an event.
long:
  - topic: "Rising cost of living"
    title: "Why Is Everything So Expensive Right Now?"
    angle: "Why do groceries, rent and cars still cost so much, and who is actually getting the money?"
    search_query: "US consumer prices cost of living"
    keywords: [why is everything so expensive, why are groceries so expensive in the us, why is housing so expensive]
  - topic: "Bernie Madoff"
    history: true
    title: "The Madoff Scheme: How One Man Stole Billions in Plain Sight"
    angle: "How did Bernie Madoff fool investors and regulators for decades?"
    search_query: "Bernie Madoff Ponzi scheme"
    wiki_title: "Madoff investment scandal"
    keywords: [madoff scheme, bernie madoff explained, madoff documentary]
  - topic: "Car prices"
    title: "Why Are Cars So Expensive Now?"
    angle: "Why has a new car moved out of reach for so many Americans?"
    search_query: "US new car prices affordability"
    keywords: [why are cars so expensive now, why are cars so expensive, car market]
  - topic: "Enron"
    history: true
    title: "Enron: The Biggest Fraud in American Business"
    angle: "How did one of America's most admired companies turn out to be a fraud?"
    search_query: "Enron collapse fraud"
    wiki_title: "Enron scandal"
    keywords: [enron scandal, enron explained, what happened to enron]
  - topic: "John D. Rockefeller"
    history: true
    collapse: false
    title: "How John D. Rockefeller Became the World's First Billionaire"
    angle: "How did a bookkeeper's assistant come to control almost all of America's oil?"
    search_query: "John D. Rockefeller Standard Oil history"
    wiki_title: "John D. Rockefeller"
    keywords: [how rockefeller became rich, rockefeller standard oil, first billionaire]
  - topic: "WorldCom"
    history: true
    title: "WorldCom: The $11 Billion Accounting Lie"
    angle: "How did WorldCom hide billions in its accounts, and who finally caught it?"
    search_query: "WorldCom accounting scandal"
    wiki_title: "MCI Inc."
    keywords: [worldcom scandal explained, worldcom collapse, bernie ebbers]
  - topic: "FTX"
    history: true
    title: "What Really Happened at FTX?"
    angle: "How did FTX lose billions of its customers' money so quickly?"
    search_query: "FTX collapse Sam Bankman-Fried trial"
    wiki_title: "Bankruptcy of FTX"
    keywords: [ftx collapse, ftx explained, ftx documentary]
  - topic: "Rent prices"
    title: "Why Is Rent So High in America?"
    angle: "Why has rent climbed so far, and what would actually bring it down?"
    search_query: "US rent prices housing shortage"
    keywords: [why is rent so high in america, why is rent so expensive, why is housing unaffordable]
  - topic: "Car loans"
    title: "Is the Car Loan Crisis Real?"
    angle: "Are more Americans falling behind on car payments, and what does that signal?"
    search_query: "auto loan delinquencies US"
    keywords: [car loan crisis, car loans explained]
  - topic: "Black Friday deals"
    not_before: 2026-11-22
    title: "Are Black Friday Deals Actually Real?"
    angle: "Are Black Friday discounts real savings, and how do retailers set those prices?"
    search_query: "Black Friday deals real discounts retailers"
    keywords: [are black friday deals real, black friday deals, black friday explained]
  - topic: "Federal Reserve interest rates"
    not_before: 2026-12-03
    title: "How the Fed's Next Decision Reaches Your Wallet"
    angle: "How does a Federal Reserve rate decision reach your mortgage, car loan and savings?"
    search_query: "Federal Reserve December meeting interest rates"
    keywords: [what does the federal reserve do, how do interest rates work, fed rate decision]

