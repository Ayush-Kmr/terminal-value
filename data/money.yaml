# "How X makes money" Shorts: the second Short of the day when
# format.short.second is "money" (strategy 2026-11-13: "How Does Kalshi
# Actually Make Money?" held 91% of viewers and kept drawing search views).
# One business model per Short, told from the company's own filings. Used ones
# are tracked in data/history.json (queue "money-short:<topic>"); add new
# topics at the bottom. Never investing advice: how the money flows, not
# whether to buy.
