# "How X makes money" Shorts: the second Short of the day when
# format.short.second is "money" (strategy 2026-11-13: "How Does Kalshi
# Actually Make Money?" held 91% of viewers and kept drawing search views).
# One business model per Short, told from the company's own filings. Used ones
# are tracked in data/history.json (queue "money-short:<topic>"); add new
# topics at the bottom. Never investing advice: how the money flows, not
# whether to buy.
# title (SEO 2026-11-14): fixed, keyword first, at most 40 characters (the
# Shorts feed shows about 40), in the 'How ... make money' form that puts every
# one in the "How It Makes Money" series playlist (upload.title_series). The
# pipeline drops a title only if its research does not support a figure in it.
# Order (calendar 2026-11-14): one a day Mon-Sat from 16 Nov, so the list
# lines up with the season: AI week, Thanksgiving and Black Friday (26-27
# Nov), Cyber Monday (30 Nov), the Fed meeting (8-9 Dec). Keep new topics
# at the bottom unless they are timed to a date.
